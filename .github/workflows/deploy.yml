name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - master
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PI_HOST }}
          username: linuxserver.io
          password: ${{ secrets.PASSWORD }}
          port: 2222
          script: whoami
